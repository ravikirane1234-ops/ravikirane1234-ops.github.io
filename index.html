<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales & Revenue Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#EEF2F5;--surf:#fff;--ink:#16222E;--mut:#5E6C7A;--line:#D9E0E6;--a:#0F6B73;--b:#E3A32B;--c:#4C7FBF;--d:#B5546B;--e:#7A9A4A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E151C;--surf:#16212B;--ink:#E7EDF2;--mut:#93A3B1;--line:#26333F;--a:#3FB6BF;--b:#F0B84A;--c:#7FA8DD;--d:#D97E93;--e:#A3C26E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E151C;--surf:#16212B;--ink:#E7EDF2;--mut:#93A3B1;--line:#26333F;--a:#3FB6BF;--b:#F0B84A;--c:#7FA8DD;--d:#D97E93;--e:#A3C26E;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:15px;font-weight:700;margin:0 0 10px}
.sub{color:var(--mut);font-size:13px}
.btn{font:600 14px Manrope,sans-serif;background:var(--a);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
:root[data-theme="dark"] .btn:not(.ghost){color:#08141A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#08141A}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.bar{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row b{font-size:13px;min-width:70px;color:var(--mut);font-weight:600}
.chip{font:600 13px Manrope,sans-serif;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#08141A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#08141A}}
input[type=date]{font:400 13px Manrope,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .l{color:var(--mut);font-size:13px}.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.up{color:var(--e)}.dn{color:var(--d)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}
@media(max-width:820px){.s8,.s4,.s6{grid-column:span 12}}
.cv{position:relative;height:260px}
ul.ins{margin:0;padding-left:18px}ul.ins li{margin:4px 0}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600}
td.n,th.n{text-align:right}
.sh{display:inline-block;height:6px;border-radius:3px;background:var(--a);vertical-align:middle}
#msg{font-size:13px;color:var(--d);min-height:18px}
.drop{outline:2px dashed var(--a);outline-offset:4px}
</style>
</head>
<body>
<main id="app">
<header>
  <div><h1>Sales & Revenue</h1><div class="sub" id="src">Sample data</div></div>
  <div class="row">
    <input type="file" id="file" accept=".csv,.xlsx,.xls" hidden>
    <button class="btn" id="imp">Import CSV or Excel</button>
    <button class="btn ghost" id="tpl">Download sample CSV</button>
    <button class="btn ghost" id="rst">Reset filters</button>
  </div>
</header>
<div id="msg" role="status">Drop a file anywhere on the page. Needs columns for date, product and revenue; category, region and units are optional.</div>
<section class="bar" aria-label="Filters">
  <div class="row"><b>Dates</b><input type="date" id="from" aria-label="From date"><span class="sub">to</span><input type="date" id="to" aria-label="To date"></div>
  <div class="row" id="regions"><b>Region</b></div>
  <div class="row" id="cats"><b>Category</b></div>
</section>
<section class="kpis" id="kpis"></section>
<section class="grid">
  <div class="card s8"><h2>Revenue by month</h2><div class="cv"><canvas id="c1"></canvas></div></div>
  <div class="card s4"><h2>Revenue by category</h2><div class="cv"><canvas id="c2"></canvas></div></div>
  <div class="card s6"><h2>Top products</h2><div class="cv"><canvas id="c3"></canvas></div></div>
  <div class="card s6"><h2>Revenue by region</h2><div class="cv"><canvas id="c4"></canvas></div></div>
  <div class="card s12"><h2>What the data says</h2><ul class="ins" id="ins"></ul></div>
  <div class="card s12"><h2>Product detail</h2><div class="wrap"><table id="tbl"></table></div></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let rows=[],sel={r:new Set(),c:new Set()},charts={},srcName='Sample data';
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',notation:Math.abs(n)>=1e5?'compact':'standard',maximumFractionDigits:Math.abs(n)>=1e5?1:0}).format(n);
const num=n=>new Intl.NumberFormat('en-US').format(Math.round(n));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function sample(){
  let s=7;const R=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
  const P=[['Aurora Laptop','Electronics',980],['Pulse Earbuds','Electronics',130],['Vista Monitor','Electronics',340],['Nimbus Desk','Furniture',420],['Orbit Chair','Furniture',260],['Lumen Lamp','Furniture',75],['Trail Pack','Outdoor',120],['Summit Tent','Outdoor',310],['Ember Stove','Outdoor',85],['Zen Notebook','Office',14],['Slate Planner','Office',28],['Quill Pen Set','Office',22]];
  const RG=['North','South','East','West'],out=[];
  for(let m=0;m<22;m++)for(let i=0;i<48;i++){
    const p=P[Math.floor(Math.pow(R(),1.4)*P.length)],u=1+Math.floor(R()*10),mo=m%12;
    const season=mo>=10?1.35:mo==6?1.1:1;
    out.push({d:new Date(2025,m,1+Math.floor(R()*28)),p:p[0],c:p[1],r:RG[Math.floor(R()*4)],u,v:Math.round(u*p[2]*(.9+R()*.2)*(1+m*.018)*season)});
  }
  return out;
}
function toDate(x){
  if(x instanceof Date&&!isNaN(x))return new Date(x.getFullYear(),x.getMonth(),x.getDate());
  if(typeof x==='number'){const d=new Date(Math.round((x-25569)*864e5));return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())}
  const d=new Date(x);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function parse(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const js=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  if(!js.length)throw new Error('The file has no rows.');
  const keys=Object.keys(js[0]);
  const f=re=>keys.find(k=>re.test(k.toLowerCase()));
  const K={d:f(/date|day|month|time/),p:f(/product|item|sku|name/),c:f(/categor|segment|type|department/),r:f(/region|area|country|territory|market|state/),v:f(/revenue|sales|amount|total|price/),u:f(/unit|qty|quantity/)};
  const miss=['d','p','v'].filter(k=>!K[k]).map(k=>({d:'a date',p:'a product',v:'a revenue'}[k]));
  if(miss.length)throw new Error('Could not find '+miss.join(', ')+' column. Found: '+keys.join(', '));
  const out=js.map(o=>({d:toDate(o[K.d]),p:String(o[K.p]||'Unknown'),c:K.c?String(o[K.c]||'Other'):'All',r:K.r?String(o[K.r]||'Other'):'All',u:K.u?+o[K.u]||0:1,v:parseFloat(String(o[K.v]).replace(/[^0-9.\-]/g,''))})).filter(x=>x.d&&isFinite(x.v));
  if(!out.length)throw new Error('No valid rows. Check the date and revenue columns.');
  return out;
}
function load(file){
  const fr=new FileReader();
  fr.onload=()=>{try{rows=parse(fr.result);srcName=file.name;$('#msg').textContent='';setup();}catch(e){$('#msg').textContent=e.message}};
  fr.onerror=()=>{$('#msg').textContent='Could not read that file.'};
  fr.readAsArrayBuffer(file);
}
function setup(){
  sel.r.clear();sel.c.clear();
  const ds=rows.map(x=>+x.d),mn=new Date(Math.min(...ds)),mx=new Date(Math.max(...ds));
  $('#from').value=$('#from').min=$('#to').min=ymd(mn);$('#to').value=$('#from').max=$('#to').max=ymd(mx);
  $('#src').textContent=srcName+' · '+num(rows.length)+' rows';
  chips('#regions','r');chips('#cats','c');render();
}
function chips(id,k){
  const box=$(id),vals=[...new Set(rows.map(x=>x[k]))].sort();
  box.querySelectorAll('.chip').forEach(e=>e.remove());
  vals.forEach(v=>{const b=document.createElement('button');b.className='chip';b.textContent=v;b.setAttribute('aria-pressed','false');
    b.onclick=()=>{sel[k].has(v)?sel[k].delete(v):sel[k].add(v);b.setAttribute('aria-pressed',sel[k].has(v));render()};box.appendChild(b)});
}
const grp=(a,k,f=x=>x.v)=>{const m=new Map();a.forEach(x=>m.set(x[k],(m.get(x[k])||0)+f(x)));return [...m].sort((p,q)=>q[1]-p[1])};
function mk(id,cfg){charts[id]&&charts[id].destroy();charts[id]=new Chart($(id),cfg)}
function render(){
  const fr=$('#from').value,to=$('#to').value;
  const a=rows.filter(x=>{const s=ymd(x.d);return s>=fr&&s<=to&&(!sel.r.size||sel.r.has(x.r))&&(!sel.c.size||sel.c.has(x.c))});
  const tot=a.reduce((s,x)=>s+x.v,0),units=a.reduce((s,x)=>s+x.u,0);
  const mon=new Map();a.forEach(x=>{const k=x.d.getFullYear()+'-'+String(x.d.getMonth()+1).padStart(2,'0');mon.set(k,(mon.get(k)||0)+x.v)});
  const ms=[...mon].sort((p,q)=>p[0]<q[0]?-1:1);
  let g=null;if(ms.length>1){const l=ms[ms.length-1][1],p=ms[ms.length-2][1];g=p?(l-p)/p*100:null}
  $('#kpis').innerHTML=[['Total revenue',money(tot)],['Orders',num(a.length)],['Units sold',num(units)],['Avg order value',a.length?money(tot/a.length):'–'],['Latest month vs prior',g==null?'–':`<span class="${g>=0?'up':'dn'}">${g>=0?'+':''}${g.toFixed(1)}%</span>`]].map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
  const pr=grp(a,'p'),ct=grp(a,'c'),rg=grp(a,'r');
  Chart.defaults.color=css('--mut');Chart.defaults.font.family='Manrope,system-ui,sans-serif';Chart.defaults.borderColor=css('--line');
  const col=['--a','--b','--c','--d','--e'].map(css),opt={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+money(c.raw)}}}};
  const ax={ticks:{callback:v=>money(v)}};
  mk('#c1',{type:'line',data:{labels:ms.map(x=>x[0]),datasets:[{data:ms.map(x=>x[1]),borderColor:col[0],backgroundColor:col[0]+'33',fill:true,tension:.3,pointRadius:3}]},options:{...opt,scales:{y:ax}}});
  mk('#c2',{type:'doughnut',data:{labels:ct.map(x=>x[0]),datasets:[{data:ct.map(x=>x[1]),backgroundColor:col,borderColor:css('--surf')}]},options:{...opt,plugins:{...opt.plugins,legend:{display:true,position:'bottom'}}}});
  mk('#c3',{type:'bar',data:{labels:pr.slice(0,7).map(x=>x[0]),datasets:[{data:pr.slice(0,7).map(x=>x[1]),backgroundColor:col[1]}]},options:{...opt,indexAxis:'y',scales:{x:ax}}});
  mk('#c4',{type:'bar',data:{labels:rg.map(x=>x[0]),datasets:[{data:rg.map(x=>x[1]),backgroundColor:col[2]}]},options:{...opt,scales:{y:ax}}});
  const L=[];
  if(pr.length)L.push(`<b>${esc(pr[0][0])}</b> is the top product at ${money(pr[0][1])}, ${(pr[0][1]/tot*100).toFixed(0)}% of revenue. The top 3 products make up ${(pr.slice(0,3).reduce((s,x)=>s+x[1],0)/tot*100).toFixed(0)}%.`);
  if(rg.length>1)L.push(`<b>${esc(rg[0][0])}</b> leads regions; <b>${esc(rg[rg.length-1][0])}</b> trails by ${money(rg[0][1]-rg[rg.length-1][1])}.`);
  if(ms.length){const b=[...ms].sort((p,q)=>q[1]-p[1])[0];L.push(`Best month: <b>${b[0]}</b> at ${money(b[1])}.`)}
  if(g!=null)L.push(`Revenue ${g>=0?'grew':'fell'} ${Math.abs(g).toFixed(1)}% from ${ms[ms.length-2][0]} to ${ms[ms.length-1][0]}. Check that the latest month is complete before reading too much into this.`);
  $('#ins').innerHTML=L.length?L.map(x=>`<li>${x}</li>`).join(''):'<li>No rows match the filters. Widen the dates or clear a slicer.</li>';
  $('#tbl').innerHTML='<tr><th>Product</th><th>Category</th><th class="n">Units</th><th class="n">Revenue</th><th>Share</th></tr>'+pr.slice(0,10).map(([p,v])=>{const r=a.filter(x=>x.p===p);return `<tr><td>${esc(p)}</td><td>${esc(r[0].c)}</td><td class="n">${num(r.reduce((s,x)=>s+x.u,0))}</td><td class="n">${money(v)}</td><td><span class="sh" style="width:${Math.max(2,v/tot*160)}px"></span> ${(v/tot*100).toFixed(1)}%</td></tr>`}).join('');
}
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
$('#from').onchange=$('#to').onchange=render;
$('#rst').onclick=setup;
$('#tpl').onclick=()=>{
  const h='Date,Product,Category,Region,Units,Revenue\n'+sample().slice(0,60).map(x=>[ymd(x.d),x.p,x.c,x.r,x.u,x.v].join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(h);a.download='sample-sales.csv';a.click();
};
['dragover','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();if(t==='drop'){$('#app').classList.remove('drop');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])}else $('#app').classList.add('drop')}));
addEventListener('dragleave',()=>$('#app').classList.remove('drop'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());
rows=sample();setup();
</script>
</body>
</html>
